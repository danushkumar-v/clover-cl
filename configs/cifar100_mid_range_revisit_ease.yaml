# Shipped example config (P9, SPEC §2/§9). NOTE:
#   - Real training on a real (3-channel) dataset now works correctly (P10
#     fixed channel-count handling -- see PLAN.md; proven end-to-end in
#     tests/test_backbones_real_image.py, using a real dataset that needs
#     no network access to verify). This config's default backbone is
#     still a tiny, untrained, CPU-only stand-in -- its adapter wrapper
#     mechanism requires a TinyViT-shaped base, so (unlike SimpleCIL) it
#     can't yet be pointed at a real timm ViT directly (real timm
#     internals hooking for this method family is future work).
#   - training.epochs/batch_size/optimizer are untuned starting points
#     (matching SPEC's own §9 example), not verified against published
#     accuracy -- that verification needs the user's own cluster access
#     (see docs/methods.md).
run:
  name: cifar100_mid_range_revisit_ease
  seed: 1993
  output_dir: runs/
stream:
  dataset: cifar100
  scenario: mid_range_revisit
  init_cls: 10
  increment: 10
  stream_seed: 42
method:
  name: ease
training:
  epochs: 5
  batch_size: 16
  optimizer: {name: adam, lr: 1.875e-3}
  amp: none
