# Shipped example config (P9, SPEC §2/§9). NOTE:
#   - Real training on a real (3-channel) dataset now works correctly (P10
#     fixed channel-count handling -- see PLAN.md; proven end-to-end in
#     tests/test_backbones_real_image.py, using a real dataset that needs
#     no network access to verify). This config's default backbone
#     (tiny_mlp) is still a tiny, untrained, CPU-only stand-in.
#   - SimpleCIL is the one method that can also use a real, pretrained
#     timm ViT directly: override `method: {name: simplecil, backbone:
#     vit_base_patch16_224, pretrained: true}` for a real accuracy run.
#   - training.epochs/batch_size/optimizer are untuned starting points
#     (matching SPEC's own §9 example), not verified against published
#     accuracy -- that verification needs the user's own cluster access
#     (see docs/methods.md).
run:
  name: cifar100_disjoint_baseline_simplecil
  seed: 1993
  output_dir: runs/
stream:
  dataset: cifar100
  scenario: disjoint_baseline
  init_cls: 10
  increment: 10
  stream_seed: 42
method:
  name: simplecil
training:
  epochs: 5
  batch_size: 16
  optimizer: {name: adam, lr: 1.875e-3}
  amp: none
