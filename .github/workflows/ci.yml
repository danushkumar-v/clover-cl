name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check clover tests

      - name: Type check (mypy)
        run: mypy clover/core clover/config

      - name: Test (pytest, CPU only)
        run: pytest tests/ -v --cov=clover --cov-report=term-missing
