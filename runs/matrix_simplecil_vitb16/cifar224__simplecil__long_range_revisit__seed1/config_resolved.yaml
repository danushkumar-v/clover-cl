run:
  name: cifar224__simplecil__long_range_revisit__seed1
  seed: 1
  output_dir: runs/matrix_simplecil_vitb16
stream:
  dataset: cifar224
  init_cls: 10
  increment: 10
  task_size: fixed
  revisits:
  - classes: task0
    placement: end_of_stream
    label: new
    images: new
    min_gap: 1
    times: 1
  shuffle_seed: 1993
  stream_seed: 1
  data_root: ./data
  dataset_num_classes: null
method:
  name: simplecil
  backbone: vit_base_patch16_224
  pretrained: true
training:
  epochs: 1
  batch_size: 64
  optimizer:
    name: adam
    lr: 0.001875
  amp: none
  cudnn_benchmark: false
