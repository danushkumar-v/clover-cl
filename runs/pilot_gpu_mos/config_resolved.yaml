run:
  name: pilot_gpu_mos
  seed: 1
  output_dir: runs/
stream:
  dataset: cifar100
  init_cls: 10
  increment: 10
  task_size: fixed
  revisits:
  - classes:
    - 0
    - 1
    - 2
    placement: every_task
    label: same
    images: new
    min_gap: 1
    times: 1
  shuffle_seed: 1993
  stream_seed: 42
  data_root: ./data
  dataset_num_classes: null
method:
  name: mos
training:
  epochs: 1
  batch_size: 64
  optimizer:
    name: adam
    lr: 0.001875
  amp: none
  cudnn_benchmark: false
